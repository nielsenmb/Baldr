[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "baldr"
version = "0.1.0rc1"
description = "Fast probability distributions for sampling and inference"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Martin Nielsen" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

[project.optional-dependencies]
numpy = ["numpy>=1.23", "scipy>=1.9"]
jax = ["jax>=0.4.28"]
empirical = ["numpy>=1.23", "scipy>=1.9"]
benchmark = ["distrax", "jax>=0.4.28", "numpy>=1.23", "numpyro", "scipy>=1.9"]
test = ["jax>=0.4.28", "numpy>=1.23", "pytest>=8", "scipy>=1.9"]
dev = ["baldr[benchmark,test]", "ruff>=0.9"]

[project.urls]
Homepage = "https://github.com/nielsenmb/Baldr"
Repository = "https://github.com/nielsenmb/Baldr"
Changelog = "https://github.com/nielsenmb/Baldr/blob/main/CHANGELOG.md"
Documentation = "https://github.com/nielsenmb/Baldr/tree/main/docs"

[tool.hatch.build.targets.wheel]
packages = ["src/baldr"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
